# A dedicated disposable PostgreSQL 17 database, never the development database.
spring.datasource.url=${PIS_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5433/pis_test?connectTimeout=5&socketTimeout=10}
spring.datasource.username=${PIS_TEST_DB_USERNAME:pis_test}
spring.datasource.password=${PIS_TEST_DB_PASSWORD}
server.servlet.session.cookie.secure=false
pis.security.development-account.enabled=false
