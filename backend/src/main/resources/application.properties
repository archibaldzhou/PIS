spring.application.name=pis-backend
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# No embedded database, no fallback credentials, and one schema migration mechanism.
spring.datasource.url=${PIS_DB_URL}
spring.datasource.username=${PIS_DB_USERNAME}
spring.datasource.password=${PIS_DB_PASSWORD}
spring.datasource.hikari.schema=pis
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=pis
spring.flyway.schemas=pis
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.connect-retries=0

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Safe session defaults. The explicit local dev/test profiles relax Secure for HTTP only.
server.servlet.session.cookie.name=PIS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=20m
server.tomcat.max-http-form-post-size=8KB
pis.security.development-account.enabled=${PIS_DEV_AUTH_ENABLED:false}
