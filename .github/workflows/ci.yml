name: PIS CI
on:
  push:
    branches: [main, validation/t15-20261002, validation/t28, validation/t29]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/pis_test?connectTimeout=5&socketTimeout=10
      PIS_TEST_DB_USERNAME: pis_test
      PIS_TEST_DB_PASSWORD: synthetic-ci-only
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: pis_test
          POSTGRES_USER: pis_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pis_test -d pis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend test and package
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Install pinned npm
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Synthetic browser UI contracts
        working-directory: frontend
        run: npm run test:ui
  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.0 --no-audit --no-fund
      - name: Audit all frontend dependencies, including development tools
        working-directory: frontend
        run: npm run audit:dependencies
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review changed npm and Maven dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
          license-check: false
